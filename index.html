<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Horaire Sélection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: tableau de signalisation — un gros voyant « qui aller voir », l'équipe en trois tuiles, la semaine en bas. Config sur un 2e onglet. */
:root{
  --bg:#0c1413; --panel:#131e1c; --panel-2:#192826; --line:#263634;
  --fg:#eaf2ef; --muted:#93a8a2; --accent:#7fd1c3;
  --go:#2fe07a; --go-ink:#06240f; --go-soft:rgba(47,224,122,.18); --go-line:rgba(47,224,122,.65); --wait:#ffc93a; --wait-ink:#2b1f00;
  --stop:#ff5a52; --stop-ink:#2e0503; --off:#56635f;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barre */
.bar{display:grid;grid-template-columns:1fr auto auto;align-items:center;grid-gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--f-display);font-size:1.35rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;letter-spacing:.04em;text-transform:none;color:var(--muted);font-weight:400}
.clock{font-family:var(--f-display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.nav{display:grid;grid-auto-flow:column;grid-gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav a{color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;font-size:.9rem}
.nav a[aria-current="page"]{background:var(--panel-2);color:var(--fg)}

.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ctx{display:grid;grid-template-columns:1fr auto;align-items:end;grid-gap:12px;margin-bottom:14px}
.ctx h2{font-size:2.4rem;font-size:clamp(1.6rem,4vw,2.4rem)}
.pill{display:inline-block;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{color:var(--go);border-color:rgba(47,224,122,.45)}
.notice{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:1.05rem}

/* voyants principaux */
.stage{display:grid;grid-template-columns:1.5fr 1fr;grid-gap:14px;margin-bottom:14px}
.side{display:grid;grid-gap:14px;align-content:start}
.sig{position:relative;border-radius:18px;padding:20px 24px;border:2px solid var(--line);background:var(--panel);overflow:hidden;min-width:0}
.sig .lbl{font-size:.9rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.sig .name{font-family:var(--f-display);font-weight:700;line-height:.95;margin-top:6px;overflow-wrap:anywhere}
.sig .sub{margin-top:8px;font-size:1rem;opacity:.85}
.sig.big .name{font-size:8.5rem;font-size:clamp(3.5rem,11vw,8.5rem)}
.sig.small .name{font-size:4.2rem;font-size:clamp(2.4rem,6vw,4.2rem)}
.sig.go{background:var(--go);color:var(--go-ink);border-color:var(--go);box-shadow:0 0 0 6px rgba(47,224,122,.18),0 0 60px rgba(47,224,122,.45)}
.sig.wait{background:var(--go-soft);color:var(--fg);border-color:var(--go-line)}
.sig.wait .lbl{color:var(--go)}
.sig .phone{display:inline-block;margin-top:10px;font-size:.95rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.28);color:inherit}
.sig.stop{background:var(--stop);color:var(--stop-ink);border-color:var(--stop)}
.sig.none{color:var(--muted)}
.sig.go::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:16px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.55);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:currentColor;margin-right:.4em;vertical-align:-.05em}

.later{border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--panel)}
.later h3{font-size:1.2rem;margin:4px 0 6px}
.later p{margin:0;color:var(--muted)}
.later b{color:var(--fg)}

/* équipe */
.team.n1{grid-template-columns:minmax(0,1fr)}
.team.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:14px;margin-bottom:22px}
.tile{border-radius:14px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;grid-gap:4px 14px;align-items:center;min-width:0}
.lamp{width:46px;height:46px;border-radius:50%;grid-row:span 2;background:var(--off);box-shadow:inset 0 -4px 8px rgba(0,0,0,.35)}
.tile .who{font-family:var(--f-display);font-size:1.9rem;font-weight:600;line-height:1}
.tile .st{font-size:.95rem;color:var(--muted)}
.tile .chips{grid-column:2;display:grid;grid-auto-flow:column;justify-content:start;grid-gap:6px}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg)}
.tile.go .lamp{background:var(--go);box-shadow:0 0 22px var(--go)}
.tile.go .st{color:var(--go)}
.tile.wait .lamp{background:var(--go-soft);box-shadow:inset 0 0 0 4px var(--go)}
.tile.wait .st{color:var(--go)}
.tile.stop .lamp{background:var(--stop);box-shadow:0 0 18px var(--stop)}
.tile.stop .st{color:var(--stop)}
.tile.off{opacity:.6}
.tile.off .who{text-decoration:line-through;text-decoration-thickness:2px}

/* semaine */
.week h3{font-size:1.3rem;margin-bottom:8px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.95rem}
thead th{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.03em;background:var(--panel)}
tbody th{color:var(--muted);font-weight:400;white-space:nowrap;font-size:.85rem}
tr:last-child th,tr:last-child td{border-bottom:0}
td.today{background:rgba(127,209,195,.09)}
td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.s2{color:var(--muted);font-size:.85rem}
.abs{text-decoration:line-through;opacity:.55}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font-size:1.8rem;margin-bottom:6px}

/* config */
.cfg{display:grid;grid-gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:1.5rem;margin-bottom:4px}
.card > p.hint{margin:0 0 12px;color:var(--muted);font-size:.92rem;max-width:65ch}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-gap:10px;align-items:end}
label.f{display:grid;grid-gap:4px;font-size:.82rem;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#06201b;border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--stop)}
.btn.danger.armed{background:var(--stop);color:var(--stop-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.list{display:grid;grid-gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:1fr auto;grid-gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item b{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.item .meta{color:var(--muted);font-size:.9rem}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-gap:10px}
.person{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-gap:8px}
.person .top{display:grid;grid-template-columns:auto 1fr;grid-gap:10px;align-items:center}
.person .lamp{width:22px;height:22px;grid-row:auto}
.person .lamp.stop{background:var(--stop);box-shadow:0 0 10px var(--stop)}
.person b{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.person .acts{display:grid;grid-template-columns:1fr auto;grid-gap:8px}
.grid td select{min-width:110px}
.grid td .pair{display:grid;grid-gap:6px}
.savebar{display:grid;grid-template-columns:1fr auto;grid-gap:10px;align-items:center;margin-top:12px}
.status{font-size:.9rem;color:var(--muted)}
.status.err{color:var(--stop)}
.temp{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--panel)}
.temp h3{font-size:1.3rem;margin-bottom:4px}
.temp p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.tempbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:10px}
.tcell{display:grid;grid-gap:6px;align-content:start}
.tbtn{padding:12px 14px;font-size:1.1rem;font-weight:700}
.tbtn.on{background:var(--stop);color:var(--stop-ink);border-color:var(--stop)}
.mine{display:grid;grid-template-columns:auto 1fr;grid-gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.mine b{font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.mine .meta{color:var(--muted)}
.mine.busy{border-color:var(--stop)}
.lamp.gofree{background:var(--go);box-shadow:0 0 10px var(--go)}
.mine .lamp{width:30px;height:30px}
.item .lamp,.mine .lamp{grid-row:auto}
.bigbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));grid-gap:10px;margin-top:12px}
.btn.big{padding:16px;font-size:1.15rem;font-weight:700}
.btn.stopb{background:var(--stop);color:var(--stop-ink);border-color:var(--stop)}
.btn.freeb{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));grid-gap:8px;margin-top:20px;color:var(--muted);font-size:.88rem}
.legend span .dot{width:.9em;height:.9em}

@media (max-width:820px){
  .sig.big .name{font-size:5rem;font-size:clamp(3.5rem,11vw,8.5rem)}
  .stage{grid-template-columns:1fr}
  .team[class]{grid-template-columns:1fr}
}
@media (max-width:520px){
  .bar{grid-template-columns:1fr auto}
  .nav{grid-column:1 / -1;justify-self:start}
  .clock{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){.sig.go::after{animation:none;opacity:.6}}
</style>
</head>

<div class="wrap">
  <header class="bar">
    <div class="brand">Équipe Sélection<small>Qui aller voir pour un client à l'accueil</small></div>
    <div class="clock" id="clock">--:--</div>
    <nav class="nav" aria-label="Vues">
      <a href="#affichage" id="nav-affichage">Affichage</a>
      <a href="#statut" id="nav-statut" hidden>Mon statut</a>
      <a href="#config" id="nav-config">Configuration</a>
    </nav>
  </header>

  <main id="view-display" aria-live="polite">
    <div class="empty"><h2>Chargement de l'horaire…</h2><p>Un instant.</p></div>
  </main>

  <main id="view-statut" hidden></main>
  <main id="view-config" hidden></main>
</div>

<script>
(function(){
var DAYS=[{k:'lun',l:'Lundi'},{k:'mar',l:'Mardi'},{k:'mer',l:'Mercredi'},{k:'jeu',l:'Jeudi'},{k:'ven',l:'Vendredi'}];
var WD=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MO=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var STANDALONE=true;
var FB_URL='https://selection-horaire-default-rtdb.firebaseio.com/';
var S={edit:null,state:'loading',cfg:null,db:null,ref:null,canWrite:true,draft:null,dirty:false,msg:'',msgErr:false,pendingCfg:false,armed:null};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function mins(t){var p=String(t||'0:0').split(':');return (+p[0])*60+(+p[1]||0)}
function hfmt(t){var p=String(t).split(':');return (+p[0])+' h'+(p[1]&&p[1]!=='00'?' '+p[1]:'')}
function dayKey(d){var w=d.getDay();return (w>=1&&w<=5)?DAYS[w-1].k:null}
function dlong(d){return WD[d.getDay()].replace(/^./,function(c){return c.toUpperCase()})+' '+d.getDate()+(d.getDate()===1?'er':'')+' '+MO[d.getMonth()]}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Math.random().toString(36).slice(2,10)}

function normalize(d){
  var c=clone(d||{});
  c.team=Array.isArray(c.team)?c.team:[];
  c.hours=c.hours||{};
  c.hours.start=c.hours.start||'09:00';c.hours.noon=c.hours.noon||'12:00';c.hours.pmStart=c.hours.pmStart||'13:00';c.hours.end=c.hours.end||'15:30';
  c.phones=c.phones||{};c.accueil=c.accueil||{};
  DAYS.forEach(function(x){
    c.phones[x.k]=c.phones[x.k]||{am:'',pm:''};
    c.accueil[x.k]=c.accueil[x.k]||{am:['',''],pm:['','']};
    ['am','pm'].forEach(function(p){var a=c.accueil[x.k][p];if(!Array.isArray(a))a=['',''];while(a.length<2)a.push('');c.accueil[x.k][p]=a.slice(0,2);});
  });
  c.absences=Array.isArray(c.absences)?c.absences:[];
  c.status=c.status||{};
  c.notice=c.notice||'';
  return c;
}
function fbOn(){return !!(STANDALONE&&FB_URL&&teamCode()&&S.liveErr!==401)}
function tempState(){
  var t=ymd(new Date()),v=null;
  if(fbOn()){v=S.today?clone(S.today):null;if(v&&!Array.isArray(v.away))v.away=v.away?Object.keys(v.away).map(function(k){return v.away[k]}):[];}
  else try{v=JSON.parse(localStorage.getItem('horaire-temp')||'null')}catch(e){}
  if(!v||v.date!==t||!Array.isArray(v.away))return {date:t,away:[],subs:{}};
  v.subs=v.subs||{};return v;
}
function tempAway(){return tempState().away}
function saveTemp(v){v.date=ymd(new Date());
  if(fbOn()){S.today=clone(v);fbReq('PUT','aujourdhui',v,function(err){if(err){S.tempErr=true;renderDisplay();}else{S.tempErr=false;pollLive();}});return;}
  try{localStorage.setItem('horaire-temp',JSON.stringify(v))}catch(e){}}
function withTemp(cfg){
  var c=cfg,nowMs=Date.now();
  if(STANDALONE&&S.live){c=clone(cfg);Object.keys(S.live).forEach(function(n){var v=S.live[n];
    if(v&&v.until>nowMs)c.status[n]={dnd:true,until:new Date(v.until).toISOString(),note:v.note||''};});}
  var ts=STANDALONE?tempState():{away:[],subs:{}};if(!ts.away.length)return c;
  c=clone(c);var t=ymd(new Date());
  ts.away.forEach(function(n){c.absences.unshift({id:'tmp-'+n,name:n,from:t,to:t,part:'jour',note:'',sub:ts.subs[n]||''})});
  return c;
}
function blankCfg(){return normalize({team:['Janet','Catherine','Andréa']})}

/* ---------- logique ---------- */
function slotFor(now,cfg){
  var h=cfg.hours,m=now.getHours()*60+now.getMinutes(),k=dayKey(now);
  if(k){
    if(m<mins(h.start))return {date:now,p:'am',when:'soon'};
    if(m<mins(h.noon))return {date:now,p:'am',when:'now'};
    if(m<mins(h.pmStart))return {date:now,p:'pm',when:'lunch'};
    if(m<mins(h.end))return {date:now,p:'pm',when:'now'};
  }
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  while(!dayKey(d))d.setDate(d.getDate()+1);
  return {date:d,p:'am',when:'next'};
}
function absenceFor(cfg,name,date,p){
  var ds=ymd(date);
  for(var i=0;i<cfg.absences.length;i++){var a=cfg.absences[i];
    if(a.name===name&&a.from<=ds&&ds<=(a.to||a.from)&&(a.part==='jour'||a.part===p))return a;}
  return null;
}
function dndFor(cfg,name,now){
  var s=cfg.status[name];
  if(s&&s.dnd&&(!s.until||new Date(s.until)>now))return s;
  return null;
}
function resolve(cfg,date,p,now,live){
  var k=dayKey(date),r={phone:'',acc:[],avail:[],skipped:[],people:{}};
  if(!k)return r;
  r.phone=cfg.phones[k][p]||'';
  var pa=r.phone?absenceFor(cfg,r.phone,date,p):null;
  if(pa&&pa.sub){r.phoneFor=r.phone;r.phone=pa.sub;}
  r.acc=cfg.accueil[k][p].filter(Boolean);
  cfg.team.forEach(function(n){r.people[n]={abs:absenceFor(cfg,n,date,p),dnd:live?dndFor(cfg,n,now):null};});
  r.acc.forEach(function(n,i){
    var st=r.people[n]||{};
    if(st.abs&&st.abs.sub)r.avail.push({name:st.abs.sub,rank:i,sub:n});
    else if(st.abs)r.skipped.push({name:n,rank:i,why:'en congé'});
    else if(st.dnd)r.skipped.push({name:n,rank:i,why:(st.dnd.note||'Ne pas déranger').toLowerCase()+(st.dnd.until?' jusqu\'à '+timeOf(st.dnd.until):'')});
    else r.avail.push({name:n,rank:i});
  });
  var seen={};r.avail=r.avail.filter(function(x){if(seen[x.name])return false;seen[x.name]=1;return true;});
  return r;
}

/* ---------- affichage ---------- */
function sigCard(kind,size,label,name,sub,phone){
  return '<div class="sig '+kind+' '+size+'"><div class="lbl"><span class="dot"></span>'+esc(label)+'</div>'+
    '<div class="name">'+esc(name)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+
    (phone?'<div class="phone">Peut être au téléphone</div>':'')+'</div>';
}
function renderDisplay(){
  var el=$('#view-display'),cfg=S.cfg?withTemp(S.cfg):null;
  if(S.state==='loading'){el.innerHTML='<div class="empty"><h2>Chargement de l\'horaire…</h2><p>Un instant.</p></div>';return;}
  if(S.state==='nodb'||S.state==='err'){el.innerHTML='<div class="empty"><h2>Horaire inaccessible</h2><p>'+(STANDALONE?'Le fichier horaire.json est introuvable ou mal formé. Il doit être dans le même dossier que cette page.':'Cette page doit être ouverte dans Claude par une personne connectée qui a accès au lien partagé.')+'</p></div>';return;}

function timeOf(iso){var d=new Date(iso);return hfmt(pad(d.getHours())+':'+pad(d.getMinutes()))}
function weekTable(cfg,sl,now){
  var base=new Date(sl.date.getFullYear(),sl.date.getMonth(),sl.date.getDate());
  var mon=new Date(base);mon.setDate(base.getDate()-((base.getDay()+6)%7));
  var dates=DAYS.map(function(_,i){var d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
  var today=ymd(now),cur=ymd(sl.date);
  function nm(n,d,p){if(!n)return '—';var a=absenceFor(cfg,n,d,p);if(!a)return esc(n);return '<span class="abs">'+esc(n)+'</span>'+(a.sub?' '+esc(a.sub):'')}
  var h='<section class="week"><h3>Semaine du '+mon.getDate()+' '+MO[mon.getMonth()]+'</h3><div class="scroll"><table><thead><tr><th></th>';
  dates.forEach(function(d,i){h+='<th>'+DAYS[i].l+' '+d.getDate()+'</th>'});
  h+='</tr></thead><tbody>';
  [['Accueil AM','acc','am'],['Accueil PM','acc','pm'],['Téléphonie AM','ph','am'],['Téléphonie PM','ph','pm']].forEach(function(row){
    h+='<tr><th scope="row">'+row[0]+'</th>';
    dates.forEach(function(d,i){
      var k=DAYS[i].k,ds=ymd(d),c=(ds===today?'today':'')+(ds===cur&&row[2]===sl.p&&sl.when==='now'?' cur':''),v;
      if(row[1]==='acc'){var a=cfg.accueil[k][row[2]];v=a[0]||a[1]?nm(a[0],d,row[2])+(a[1]?'<div class="s2">2e '+nm(a[1],d,row[2])+'</div>':''):'—';}
      else v=nm(cfg.phones[k][row[2]],d,row[2]);
      h+='<td class="'+c+'">'+v+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div></section>';
}

}

/* ---------- écriture ---------- */
var chain=Promise.resolve();
function save(mut,okMsg){
  var c=normalize(base()||blankCfg());mut(c);c.updatedAt=new Date().toISOString();
  if(STANDALONE&&fbOn()){
    S.fbCfg=c;S.cfg=c;render();
    fbReq('PUT','config',c,function(err){
      if(err===401){S.liveErr=401;flash('Code d\'équipe invalide sur cet appareil. Entrez-le dans « Mon statut ».',true);}
      else if(err)flash('Pas enregistré : vérifiez la connexion internet et réessayez.',true);
      else flash(okMsg||'Enregistré.');
    });
    return Promise.resolve();
  }
  if(STANDALONE){S.edit=c;try{localStorage.setItem('horaire-edit',JSON.stringify(c))}catch(e){}
    S.forceCfg=true;render();flash('Changement prêt. Copiez le fichier en haut pour le publier.');return Promise.resolve();}
  S.cfg=c;render();
  chain=chain.then(function(){return S.ref.set(c)}).then(function(){flash(okMsg||'Enregistré.')},function(e){
    if(e&&e.code==='invalid_argument'){S.canWrite=false;flash('Vous n\'avez pas le droit de modifier cet horaire.',true)}
    else flash('Pas enregistré : la connexion a échoué. Réessayez dans un moment.',true);
  });
  return chain;
}
function flash(m,err){S.msg=m;S.msgErr=!!err;var e=$('#msg');if(e){e.textContent=m;e.className='status'+(err?' err':'')}
  clearTimeout(flash.t);flash.t=setTimeout(function(){S.msg='';var e2=$('#msg');if(e2&&!S.dirty)e2.textContent=''},4000);}

document.addEventListener('click',function(ev){
  var b=ev.target.closest&&ev.target.closest('[data-act]'),mk=ev.target.closest&&ev.target.closest('#mk');
  if(mk&&S.ref){save(function(){},'Horaire créé.');return;}
  if(!b||b.disabled)return;
  var act=b.getAttribute('data-act'),cfg=S.cfg;
  if(act!=='delabs'&&S.armed){S.armed=null;}
  if(act==='dnd'){
    var i=+b.getAttribute('data-n'),n=cfg.team[i],dur=$('#dn-dur-'+i).value,note=$('#dn-note-'+i).value.trim(),until;
    var now=new Date();
    if(dur==='day'){var e=mins(cfg.hours.end);until=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(e/60),e%60);}
    else until=new Date(now.getTime()+(+dur)*60000);
    S.forceCfg=true;save(function(c){c.status[n]={dnd:true,until:until.toISOString(),note:note}},n+' : ne pas déranger.');
  }else if(act==='clear'){
    var n2=cfg.team[+b.getAttribute('data-n')];S.forceCfg=true;
    save(function(c){delete c.status[n2]},n2+' : selon l\'horaire.');
  }else if(act==='notice'){
    var v=$('#notice').value.trim();S.forceCfg=true;save(function(c){c.notice=v},v?'Message affiché.':'Message retiré.');
  }else if(act==='addabs'){
    var a={id:uid(),name:$('#ab-name').value,from:$('#ab-from').value,to:$('#ab-to').value||$('#ab-from').value,part:$('#ab-part').value,sub:$('#ab-sub').value.trim(),note:$('#ab-note').value.trim()};
    if(!a.name){flash('Choisissez la personne absente.',true);return;}
    if(!a.from){flash('Indiquez la date de début.',true);return;}
    if(a.to<a.from){flash('La date de fin est avant la date de début.',true);return;}
    S.forceCfg=true;save(function(c){c.absences.push(a)},'Absence ajoutée pour '+a.name+'.');
  }else if(act==='delabs'){
    var id=b.getAttribute('data-id');
    if(S.armed!==id){S.armed=id;S.forceCfg=true;renderConfig();return;}
    S.armed=null;S.forceCfg=true;save(function(c){c.absences=c.absences.filter(function(x){return x.id!==id})},'Absence retirée.');
  }else if(act==='savebase'){
    var D=S.draft;S.dirty=false;S.forceCfg=true;
    save(function(c){
      // renommer partout
      c.team.forEach(function(old,i){var nw=D.team[i];if(nw&&old!==nw){
        c.absences.forEach(function(x){if(x.name===old)x.name=nw});
        if(c.status[old]){c.status[nw]=c.status[old];delete c.status[old];}
      }});
      c.team=D.team.filter(Boolean);c.hours=D.hours;c.phones=D.phones;c.accueil=D.accueil;
    },'Horaire enregistré.');
  }else if(act==='setcode'){
    var cv=$('#st-code').value.trim();if(!cv)return;
    try{localStorage.setItem('horaire-code',cv)}catch(e){}S.liveErr=null;renderStatut();pollLive();
  }else if(act==='st'||act==='stfree'){
    var me=getMe();if(!me)return;
    var body=null,method='DELETE';
    if(act==='st'){
      var dv=$('#st-dur').value,nw=new Date(),u;
      if(dv==='day'){var em=mins(S.cfg.hours.end);u=new Date(nw.getFullYear(),nw.getMonth(),nw.getDate(),Math.floor(em/60),em%60).getTime();}
      else u=nw.getTime()+(+dv)*60000;
      body={until:u,note:b.getAttribute('data-kind')==='rdv'?'En rendez-vous':'Ne pas déranger'};method='PUT';
    }
    b.disabled=true;stMsg('Envoi…');
    fbReq(method,'statuts/'+encodeURIComponent(me),body,function(err){
      if(err===401){S.liveErr=401;renderStatut();return;}
      if(err){b.disabled=false;stMsg('Pas envoyé : vérifiez la connexion internet et réessayez.',true);return;}
      S.live=S.live||{};if(body)S.live[me]=body;else delete S.live[me];
      renderStatut();stMsg(body?'Envoyé. L\'accueil vous voit comme « '+body.note+' ».':'Envoyé. Vous êtes de nouveau disponible.');
      pollLive();
    });
  }else if(act==='tmp'){
    var tn=S.cfg.team[+b.getAttribute('data-n')],ts=tempState(),ix=ts.away.indexOf(tn);
    if(ix>=0){ts.away.splice(ix,1);delete ts.subs[tn];}else ts.away.push(tn);
    saveTemp(ts);renderDisplay();
  }else if(act==='copy'){
    var ta=$('#export'),txt=ta.value;
    var fb=function(){ta.focus();ta.select();try{document.execCommand('copy');flash('Copié.')}catch(e){flash('Sélectionnez le texte et copiez-le.',true)}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){flash('Copié. Collez-le dans horaire.json sur GitHub.')},fb);else fb();}catch(e){fb()}
  }else if(act==='discard'){
    S.edit=null;S.dirty=false;S.draft=null;try{localStorage.removeItem('horaire-edit')}catch(e){}S.forceCfg=true;renderConfig();flash('Retour à la version en ligne.');
  }else if(act==='cancel'){S.dirty=false;S.draft=null;S.forceCfg=true;renderConfig();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.hasAttribute&&t.hasAttribute('data-me')){try{localStorage.setItem('horaire-me',t.value)}catch(e){}t.blur();renderStatut();return;}
  if(t.hasAttribute&&t.hasAttribute('data-tsub')){var ts=tempState(),nn=S.cfg.team[+t.getAttribute('data-tsub')],v=t.value.trim();
    if(v)ts.subs[nn]=v;else delete ts.subs[nn];saveTemp(ts);renderDisplay();return;}
  var D=S.draft;if(!D)return;
  if(t.hasAttribute('data-team')){
    var i=+t.getAttribute('data-team'),old=D.team[i],nw=t.value.trim();if(!nw||old===nw)return;
    D.team[i]=nw;
    DAYS.forEach(function(d){['am','pm'].forEach(function(p){
      if(D.phones[d.k][p]===old)D.phones[d.k][p]=nw;
      D.accueil[d.k][p]=D.accueil[d.k][p].map(function(x){return x===old?nw:x});
    })});
    S.dirty=true;S.forceCfg=true;renderConfig();return;
  }
  if(t.hasAttribute('data-hr')){D.hours[t.getAttribute('data-hr')]=t.value;S.dirty=true;}
  else if(t.hasAttribute('data-ph')){var p=t.getAttribute('data-ph').split('|');D.phones[p[0]][p[1]]=t.value;S.dirty=true;}
  else if(t.hasAttribute('data-acc')){var q=t.getAttribute('data-acc').split('|');D.accueil[q[0]][q[1]][+q[2]]=t.value;S.dirty=true;}
  else return;
  S.msg='';var m=$('#msg');if(m){m.textContent='Modifications non enregistrées.';m.className='status'}
  var sb=document.querySelector('[data-act="savebase"]');if(sb&&S.canWrite)sb.disabled=false;
});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.pendingCfg)renderConfig()},250)});

function ghEditUrl(){
  var m=location.hostname.match(/^([^.]+)\.github\.io$/);if(!m)return '';
  var parts=location.pathname.split('/').filter(Boolean);var repo=parts.length&&!/\.html?$/.test(parts[0])?parts[0]:m[1]+'.github.io';
  return 'https://github.com/'+m[1]+'/'+repo+'/edit/main/horaire.json';
}
function exportCard(cfg){
  var changed=!!S.edit,gh=ghEditUrl();
  return '<section class="card"><h2>Publier les changements</h2><p class="hint">'+
    (changed?'Vous avez des changements sur cet appareil qui ne sont <b style="color:var(--wait)">pas encore publiés</b>. ':'Aucun changement en attente. ')+
    'Pour publier : 1) Copier le fichier. 2) Ouvrir horaire.json sur GitHub (crayon). 3) Tout remplacer par le texte copié. 4) Commit changes. Les écrans se mettent à jour dans les minutes suivantes.</p>'+
    '<textarea id="export" readonly rows="5" style="font-family:ui-monospace,Menlo,monospace;font-size:.8rem">'+esc(JSON.stringify(cfg,null,2))+'</textarea>'+
    '<div class="savebar"><span></span><span><button class="btn" data-act="copy">Copier le fichier</button> '+
    (gh?'<a class="btn" style="text-decoration:none;display:inline-block" href="'+esc(gh)+'" target="_blank" rel="noopener">Ouvrir horaire.json sur GitHub</a> ':'')+
    (changed?'<button class="btn danger" data-act="discard">Abandonner mes changements</button>':'')+'</span></div></section>';
}
function loadJson(){
  var x=new XMLHttpRequest();
  x.open('GET','horaire.json?t='+Date.now());
  x.onload=function(){
    if(x.status>=200&&x.status<300){try{S.jsonCfg=normalize(JSON.parse(x.responseText));if(!S.fbCfg)S.cfg=S.jsonCfg;S.state='ok';}catch(e){if(!S.cfg)useSeed();}}
    else if(!S.cfg)useSeed();
    refreshView();
  };
  x.onerror=function(){if(!S.cfg)useSeed();refreshView();};
  x.send();
}
function useSeed(){var el=document.getElementById('seed');if(el){try{S.cfg=normalize(JSON.parse(el.textContent));S.state='ok';return;}catch(e){}}S.state='err';}

/* ---------- statuts en direct (Firebase) ---------- */
function teamCode(){
  var m=location.search.match(/[?&]code=([A-Za-z0-9_-]+)/);
  if(m){try{localStorage.setItem('horaire-code',m[1])}catch(e){}return m[1];}
  try{return localStorage.getItem('horaire-code')||''}catch(e){return ''}
}
function getMe(){try{return localStorage.getItem('horaire-me')||''}catch(e){return ''}}
function fbReq(method,path,body,cb){
  var x=new XMLHttpRequest();
  x.open(method,FB_URL+'e/'+teamCode()+(path?'/'+path:'')+'.json');
  x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){cb(x.status>=200&&x.status<300?null:x.status,x.responseText)};
  x.onerror=function(){cb('net')};
  x.send(body?JSON.stringify(body):null);
}
function pollLive(){
  if(!FB_URL||!teamCode())return;
  fbReq('GET','',null,function(err,t){
    if(!err&&t===S.lastTree&&view()!=='affichage')return;
    if(!err)S.lastTree=t;
    if(!err){try{var all=JSON.parse(t)||{};S.live=all.statuts||{};S.today=all.aujourdhui||null;S.liveErr=null;
      if(all.config&&all.config.team){S.fbCfg=normalize(all.config);S.cfg=S.fbCfg;S.state='ok';}}catch(e){}}else S.liveErr=err;
    var ae=document.activeElement;if(!(ae&&/INPUT|SELECT/.test(ae.tagName)))refreshView();
  });
}
function durOpts(){return '<option value="15">15 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>1 heure</option><option value="90">1 h 30</option><option value="120">2 heures</option><option value="day">Jusqu\'à la fin de la journée</option>'}
function renderStatut(){
  var el=$('#view-statut');
  if(!S.cfg){el.innerHTML='<div class="empty"><h2>Chargement…</h2></div>';return;}
  if(!FB_URL){el.innerHTML='<div class="empty"><h2>Statuts pas encore configurés</h2><p>La connexion aux statuts en direct n\'est pas encore installée.</p></div>';return;}
  var code=teamCode(),h='<div class="cfg">';
  if(!code||S.liveErr===401){
    h+='<section class="card"><h2>Code d\'équipe</h2><p class="hint">'+(S.liveErr===401?'Ce code ne fonctionne pas. Vérifiez-le et entrez-le de nouveau.':'Entrez le code d\'équipe une seule fois sur cet appareil. Il sera retenu.')+'</p>'+
      '<div class="savebar"><input id="st-code" placeholder="sel-…" autocomplete="off" autocapitalize="off"><button class="btn primary" data-act="setcode">Enregistrer</button></div></section></div>';
    el.innerHTML=h;return;
  }
  var me=getMe(),now=Date.now(),live=S.live||{};
  h+='<section class="card"><h2>Mon statut</h2><p class="hint">Gardez cette page ouverte sur votre poste. L\'affichage de l\'accueil se met à jour en moins de 15 secondes.</p>'+
    '<div class="row" style="margin-bottom:14px"><label class="f">Qui êtes-vous ?<select id="st-me" data-me="1">'+opts(S.cfg.team,me,'Choisir…')+'</select></label></div>';
  if(me){
    var v=live[me],on=v&&v.until>now;
    h+='<div class="mine'+(on?' busy':'')+'"><span class="lamp'+(on?' stop':' gofree')+'"></span><div><b>'+esc(me)+'</b><div class="meta">'+
      (on?esc(v.note)+' jusqu\'à '+timeOf(new Date(v.until).toISOString()):'Disponible, selon l\'horaire')+'</div></div></div>'+
      '<div class="row" style="margin-top:14px"><label class="f">Durée<select id="st-dur">'+durOpts()+'</select></label></div>'+
      '<div class="bigbtns"><button class="btn big stopb" data-act="st" data-kind="rdv">En rendez-vous</button>'+
      '<button class="btn big stopb" data-act="st" data-kind="dnd">Ne pas déranger</button>'+
      '<button class="btn big freeb" data-act="stfree"'+(on?'':' disabled')+'>Je suis disponible</button></div>';
  }
  h+='<div class="savebar"><span class="status" id="st-msg"></span><span></span></div></section>';
  h+='<section class="card"><h2>L\'équipe en ce moment</h2><div class="list">';
  S.cfg.team.forEach(function(n){var v=live[n],on=v&&v.until>now;
    h+='<div class="item"><div><b>'+esc(n)+'</b> <span class="meta">'+(on?esc(v.note)+' jusqu\'à '+timeOf(new Date(v.until).toISOString()):'Selon l\'horaire')+'</span></div><span class="lamp'+(on?' stop':' gofree')+'" style="width:18px;height:18px"></span></div>';});
  h+='</div></section></div>';
  el.innerHTML=h;
}
function stMsg(m,err){var e=$('#st-msg');if(e){e.textContent=m;e.className='status'+(err?' err':'')}}

/* ---------- vues ---------- */
function view(){return location.hash==='#config'?'config':(location.hash==='#statut'&&STANDALONE)?'statut':'affichage'}
function refreshView(){var v=view();if(v==='affichage')renderDisplay();else if(v==='statut')renderStatut();else renderConfig();}
function render(){
  var v=view();
  $('#view-display').hidden=v!=='affichage';$('#view-config').hidden=v!=='config';$('#view-statut').hidden=v!=='statut';
  $('#nav-statut').hidden=!STANDALONE;
  $('#nav-affichage').setAttribute('aria-current',v==='affichage'?'page':'false');
  $('#nav-config').setAttribute('aria-current',v==='config'?'page':'false');
  $('#nav-statut').setAttribute('aria-current',v==='statut'?'page':'false');
  refreshView();
}
function tick(){var d=new Date();$('#clock').textContent=d.getHours()+' h '+pad(d.getMinutes());}
window.addEventListener('hashchange',function(){S.forceCfg=true;render()});
tick();render();
setInterval(tick,5000);
setInterval(function(){var ae=document.activeElement;if(view()==='affichage'&&!(ae&&/INPUT|SELECT/.test(ae.tagName)))renderDisplay();},30000);

// garder l'écran allumé quand c'est permis
var lock=null;
function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){lock=l},function(){})}catch(e){}}
document.addEventListener('visibilitychange',wake);wake();

/* ---------- données partagées ---------- */
function waitClaude(ms){return new Promise(function(res){var t0=Date.now();(function chk(){if(window.claude&&window.claude.use)return res(window.claude);if(Date.now()-t0>ms)return res(null);setTimeout(chk,100)})()})}
if(STANDALONE){
  try{var ed=localStorage.getItem('horaire-edit');if(ed)S.edit=normalize(JSON.parse(ed));}catch(e){}
  loadJson();setInterval(loadJson,60000);
  pollLive();setInterval(pollLive,15000);
}else waitClaude(6000).then(function(cl){
  if(!cl){S.state='nodb';render();return null;}
  return cl.use('db').then(function(db){
    if(!db){S.state='nodb';render();return;}
    S.db=db;S.ref=db.doc('horaire/config');
    cl.use('user').then(function(u){
      if(!u||!u.can)return;
      return Promise.resolve(u.can('data.write')).then(function(c){if(c===false){S.canWrite=false;S.forceCfg=true;render();}});
    }).catch(function(){});
    S.ref.onSnapshot(function(s){
      S.state='ok';S.cfg=s.exists?normalize(s.data()):null;
      refreshView();
    },function(e){S.state='err';render();});
  });
}).catch(function(){S.state='nodb';render();});
})();
</script>
